
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração - Barbearia Talento</title>
<style>
* { box-sizing: border-box; }
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}
header {
  background: #d71920;
  padding: 22px;
  text-align: center;
}
main {
  max-width: 450px;
  margin: 50px auto;
  padding: 25px;
}
input, button {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  font-size: 16px;
}
button {
  background: #d71920;
  color: white;
  border: none;
  cursor: pointer;
}
input { border: 1px solid #ccc; }
#mensagem { color: #ff9999; }
</style>
</head>
<body>
<header>
<h1>BARBEARIA TALENTO</h1>
<p>Painel Administrativo</p>
</header>
<main>
<h2>Entrar no sistema</h2>
<form id="login">
<input type="email" id="email"
 placeholder="Seu e-mail" required>
<input type="password" id="senha"
 placeholder="Sua senha" required>
<button type="submit">Entrar</button>
</form>
<p id="mensagem"></p>
  
<section id="painel" style="display:none; margin-top:30px;">
  <h2>Painel Administrativo</h2>
  <p>Bem-vindo à Barbearia Talento!</p>

 <button type="button" onclick="abrirAgenda()">Agenda</button>
  <button type="button">Profissionais</button>
  <button type="button">Clientes</button>
  <button type="button">Caixa</button>
  <button type="button">Relatórios</button>
</section>
<section id="telaAgenda" style="display:block; margin-top:30px;">
  <h2>Agenda - Barbearia Talento</h2>

  <label>Escolha o profissional:</label>
<select id="profissional">
  <option value="">Selecione</option>
</select>

  <h3>Agendamentos</h3>
  <p>Selecione um profissional para consultar os horários.</p>
<div id="listaHorarios"></div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://urfeqeoqkpgzuyul klnk.supabase.co".replace(" ", "");
  const SUPABASE_KEY = "sb_publishable_BgFIN8TtCC2zIYWCBxV1EA_vpnXlXrD";

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function carregarProfissionais() {
  const { data, error } = await db
   .from("profissionais")
    .select("id, nome")
    .eq("ativo", true)
    .order("nome");

  const select = document.getElementById("profissional");

  if (error) {
    alert("Erro ao carregar profissionais: " + error.message);
    return;
  }

  select.innerHTML = '<option value="">Selecione</option>';

  data.forEach(p => {
    const option = document.createElement("option");
    option.value = p.id;
    option.textContent = p.nome;
    select.appendChild(option);
  });
}

carregarProfissionais();
  document.getElementById("login").addEventListener("submit", async function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("senha").value;
    const mensagem = document.getElementById("mensagem");

    mensagem.textContent = "Verificando acesso...";

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      mensagem.textContent = "Não foi possível entrar. Confira e-mail e senha.";
      return;
    }

    mensagem.textContent = "Login realizado! Preparando painel administrativo.";
    document.getElementById("login").hidden = true;
document.getElementById("painel").style.display = "block";
  });
</script>
<script>
function abrirAgenda() {
  document.getElementById("telaAgenda").style.display = "block";
  
}
  
document.getElementById("profissional").addEventListener("change", async function () {
  const lista = document.getElementById("listaHorarios");
  const profissional = this.value;

  if (!profissional) {
    lista.textContent = "Escolha um profissional.";
    return;
  }

  lista.textContent = "Buscando agendamentos...";

  const { data, error } = await db
    .from("agendamentos")
    .select("cliente_nome, inicio, status, profissional_id")
    .eq("profissional_id", profissional)
    .order("inicio", { ascending: true });

  if (error) {
    lista.textContent = "Erro ao consultar: " + error.message;
    return;
  }

  lista.replaceChildren();

  if (!data.length) {
    lista.textContent = "Nenhum agendamento encontrado.";
    return;
  }

  data.forEach(item => {
    const linha = document.createElement("p");
    const horario = new Date(item.inicio).toLocaleString("pt-BR", {
      timeZone: "America/Sao_Paulo"
    });

    linha.textContent = `${horario} - ${item.cliente_nome} - ${item.status}`;
    lista.appendChild(linha);
  });
});

</script>
</body>
</html>
