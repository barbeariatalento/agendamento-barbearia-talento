
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administração - Barbearia Talento</title>
<style>
* { box-sizing: border-box; }
body {
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
}
header {
  background: #d71920;
  padding: 22px;
  text-align: center;
}
main {
  max-width: 450px;
  margin: 50px auto;
  padding: 25px;
}
input, button {
  width: 100%;
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  font-size: 16px;
}
button {
  background: #d71920;
  color: white;
  border: none;
  cursor: pointer;
}
input { border: 1px solid #ccc; }
#mensagem { color: #ff9999; }
</style>
</head>
<body>
<header>
<h1>BARBEARIA TALENTO</h1>
<p>Painel Administrativo</p>
</header>
<main>
<h2>Entrar no sistema</h2>
<form id="login">
<input type="email" id="email"
 placeholder="Seu e-mail" required>
<input type="password" id="senha"
 placeholder="Sua senha" required>
<button type="submit">Entrar</button>
</form>
<p id="mensagem"></p>
</main>
<script>
document.getElementById("login")
.addEventListener("submit", function(e) {
  e.preventDefault();
  document.getElementById("mensagem")
    .textContent =
    "Tela criada! A conexão segura será configurada.";
});
</script>
</body>
</html>
