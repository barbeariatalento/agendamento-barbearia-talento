<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barbearia Talento | Agendar</title>
<style>
:root{font-family:Arial,sans-serif;color:#f7f7f7;background:#101012}*{box-sizing:border-box}body{margin:0;padding:0 14px 35px}.top{background:#19191c;margin:0 -14px 24px;padding:22px 14px;text-align:center;border-bottom:3px solid #d9212b}.top strong{font-size:24px;letter-spacing:.5px}.top p{color:#bbb;margin:8px 0 0}.wrap{max-width:480px;margin:auto}.progress{display:flex;gap:6px;margin:18px 0 24px}.progress span{height:5px;background:#3b3b40;border-radius:5px;flex:1}.progress span.active{background:#e42b35}h1{font-size:23px;margin:0 0 10px}p.hint{color:#bbb;font-size:14px;line-height:1.5;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:1px solid #555;background:#222226;color:#fff;padding:18px 10px;border-radius:13px;font-size:16px;cursor:pointer;min-height:92px}.choice small{display:block;color:#bbb;margin-top:8px}.grid.services{grid-template-columns:1fr 1fr}.grid.services .choice{min-height:100px;overflow-wrap:anywhere}.choice.selected{border:2px solid #f13540;background:#35191d}.times{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.times .choice{min-height:52px;padding:12px 3px;font-weight:bold}.field{display:block;margin:15px 0 7px;font-weight:bold}input{display:block;width:100%;padding:15px;font-size:16px;border:1px solid #555;border-radius:10px;background:#222226;color:white;color-scheme:dark}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;margin-top:22px}.btn{background:#d9212b;color:white;border:0;border-radius:11px;padding:16px;font-size:16px;font-weight:bold;cursor:pointer;flex:1}.back{background:#333;flex:0 0 95px}.whats{display:block;background:#188a4a;color:white;text-decoration:none;text-align:center;border-radius:12px;padding:18px;font-weight:bold;margin-top:20px}.summary{background:#222226;border-radius:13px;padding:16px;line-height:1.9;margin-top:18px}.summary div{display:flex;justify-content:space-between;gap:15px}.summary span{color:#bbb}.summary b{text-align:right;overflow-wrap:anywhere}.success{text-align:center;font-size:58px;color:#45d483}.notice{color:#f5c7c7;line-height:1.5;min-height:22px;margin-top:16px}.muted{color:#aaa;font-size:13px;text-align:center;margin-top:14px}.hidden{display:none!important}
</style>
</head>
<body>
<header class="top"><strong>💈 BARBEARIA TALENTO</strong><p>Seu horário em poucos passos</p></header>
<main class="wrap"><div id="progress" class="progress"></div><section id="screen"></section><div id="notice" class="notice" role="status" aria-live="polite"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
const SUPABASE_URL='https://urfeqeoqkpgzuyulklnk.supabase.co';
const SUPABASE_KEY='sb_publishable_BgFIN8TtCC2zIYWCBxV1EA_vpnXlXrD';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const WHATSAPP='5519995873937';
let SERVICOS=[];
let profissionais=[],etapa=0,carregando=false;
let dados={profissional:null,servico:null,data:'',hora:'',nome:'',telefone:''};
const screen=document.getElementById('screen'),notice=document.getElementById('notice');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function aviso(t=''){notice.textContent=t;}
function hojeBR(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function agoraBR(){return new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());}
function dataBR(v){return v.split('-').reverse().join('/');}
function nomeServico(){return dados.servico?.nome||'';}
function formatarPreco(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function botoesNavegacao(avancar=false){return `<div class="actions"><button type="button" class="btn back" onclick="voltar()">Voltar</button>${avancar?'<button type="button" class="btn" onclick="avancar()">Continuar →</button>':''}</div>`;}
function progresso(){document.getElementById('progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<=etapa?'active':''}"></span>`).join('');}
function render(){aviso();progresso();if(etapa===0){screen.innerHTML=`<h1>Com quem deseja agendar?</h1><p class="hint">Toque no profissional desejado.</p><div class="grid">${profissionais.map((p,i)=>`<button class="choice" onclick="selecionarProfissional(${i})">✂️<br><b>${esc(p.nome)}</b></button>`).join('')}</div>`;return;}
if(etapa===1){screen.innerHTML=`<h1>Qual serviço deseja?</h1><p class="hint">Escolha uma opção.</p><div class="grid services">${SERVICOS.map((s,i)=>`<button class="choice" onclick="selecionarServico(${i})"><b>${esc(s.nome)}</b><small>${s.minutos} minutos${s.preco!=null?' · '+formatarPreco(s.preco):''}</small></button>`).join('')}</div>${botoesNavegacao()}`;return;}
if(etapa===2){screen.innerHTML=`<h1>Escolha dia e horário</h1><p class="hint">Profissional: ${esc(dados.profissional.nome)} · ${esc(nomeServico())}</p><label class="field" for="data">Data</label><input type="date" id="data" min="${hojeBR()}" value="${esc(dados.data)}" onchange="mudarData(this.value)"><p class="hint" style="margin-top:15px">Horários livres</p><div id="horarios" class="times"></div>${botoesNavegacao()}`;if(dados.data)buscarHorarios();else document.getElementById('horarios').innerHTML='<p class="hint">Escolha primeiro uma data.</p>';return;}
if(etapa===3){screen.innerHTML=`<h1>Falta só um pouquinho!</h1><p class="hint">Informe seus dados para confirmar.</p><label class="field" for="nome">Seu nome</label><input id="nome" maxlength="100" autocomplete="name" placeholder="Nome completo" value="${esc(dados.nome)}"><label class="field" for="telefone">WhatsApp com DDD</label><input id="telefone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(19) 99999-9999" value="${esc(dados.telefone)}"><div class="summary">${resumo()}</div><div class="actions"><button class="btn back" onclick="voltar()">Voltar</button><button id="confirmar" class="btn" onclick="confirmar()">Confirmar agendamento</button></div><p class="muted">Seu horário só estará confirmado após ser salvo na agenda.</p>`;return;}
if(etapa===4){const texto=`Olá, Barbearia Talento! 💈\nMeu agendamento foi confirmado:\n\n👤 Cliente: ${dados.nome}\n📱 Telefone: ${dados.telefone}\n✂️ Profissional: ${dados.profissional.nome}\n💇 Serviço: ${nomeServico()}\n📅 Data: ${dataBR(dados.data)}\n🕒 Horário: ${dados.hora}`;screen.innerHTML=`<div class="success">✓</div><h1 style="text-align:center">Agendamento confirmado!</h1><p class="hint" style="text-align:center">Seu horário foi registrado na agenda.</p><div class="summary">${resumo(true)}</div><a class="whats" id="whats" target="_blank" rel="noopener noreferrer">🟢 Enviar agendamento pelo WhatsApp</a><p class="muted">O WhatsApp abrirá com a mensagem pronta. Toque em Enviar.</p><button class="btn" style="width:100%;margin-top:12px" onclick="novo()">Fazer outro agendamento</button>`;document.getElementById('whats').href='https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(texto);}}
function resumo(comNome=false){return `${comNome?`<div><span>Cliente</span><b>${esc(dados.nome)}</b></div>`:''}<div><span>Profissional</span><b>${esc(dados.profissional.nome)}</b></div><div><span>Serviço</span><b>${esc(nomeServico())}</b></div>${dados.servico?.preco!=null?`<div><span>Valor informado</span><b>${esc(formatarPreco(dados.servico.preco))}</b></div>`:''}<div><span>Data</span><b>${esc(dataBR(dados.data))}</b></div><div><span>Horário</span><b>${esc(dados.hora)}</b></div>`;}
function selecionarProfissional(i){dados.profissional=profissionais[i];dados.servico=null;dados.data='';dados.hora='';etapa=1;render();}
function selecionarServico(i){dados.servico=SERVICOS[i];dados.data='';dados.hora='';etapa=2;render();}
function voltar(){if(etapa>0&&etapa<4){etapa--;render();}}
function avancar(){if(etapa===2){if(!dados.hora){aviso('Escolha um horário disponível.');return;}etapa=3;render();}}
function novo(){dados={profissional:null,servico:null,data:'',hora:'',nome:'',telefone:''};etapa=0;render();}
function mudarData(v){dados.data=v;dados.hora='';buscarHorarios();}
let consulta=0;
async function consultarOcupacoes(data, profissionalId) {
  const inicioDia = data + 'T00:00:00-03:00';
  const fimDia = new Date(new Date(inicioDia).getTime() + 24*60*60*1000).toISOString();
  const {data:ocupacoes,error} = await db.rpc('horarios_ocupados_publicos', {
    p_profissional_id: profissionalId,
    p_inicio: inicioDia,
    p_fim: fimDia
  });
  if(error || !Array.isArray(ocupacoes)) throw error || new Error('Consulta de disponibilidade inválida');
  return ocupacoes;
}
async function buscarHorarios(){
  const seq=++consulta,alvo=document.getElementById('horarios');
  if(!alvo)return;
  alvo.innerHTML='<p class="hint">Consultando agenda...</p>';
  if(!dados.data||dados.data<hojeBR()){
    alvo.innerHTML='';aviso('Escolha uma data válida.');return;
  }
  const semana=new Date(dados.data+'T12:00:00-03:00').getUTCDay();
  if(semana===0||semana===1){alvo.innerHTML='<p class="hint">Não atendemos domingo ou segunda-feira.</p>';return;}
  let ocupacoes;
  try { ocupacoes=await consultarOcupacoes(dados.data,dados.profissional.id); }
  catch(e){
    console.error('Erro na consulta de horários:',e);
    if(seq===consulta&&etapa===2){alvo.innerHTML='<p class="hint">Não foi possível verificar a disponibilidade. Tente novamente mais tarde.</p>';dados.hora='';}
    return;
  }
  if(seq!==consulta||etapa!==2)return;
  const abertura=semana===6?8:9,fechamento=semana===6?18:20,duracao=dados.servico.minutos,lista=[];
  for(let minutos=abertura*60;minutos+duracao<=fechamento*60;minutos+=20){
    const hora=String(Math.floor(minutos/60)).padStart(2,'0')+':'+String(minutos%60).padStart(2,'0');
    if(dados.data===hojeBR()&&hora<=agoraBR())continue;
    const inicio=new Date(`${dados.data}T${hora}:00-03:00`),fim=new Date(inicio.getTime()+duracao*60000);
    const ocupado=ocupacoes.some(a=>inicio<new Date(a.fim)&&fim>new Date(a.inicio));
    if(!ocupado)lista.push(hora);
  }
  alvo.innerHTML=lista.length?lista.map(h=>`<button type="button" class="choice ${dados.hora===h?'selected':''}" onclick="selecionarHora('${h}')">${h}</button>`).join(''):'<p class="hint">Nenhum horário livre. Escolha outra data.</p>';
}
function selecionarHora(h){dados.hora=h;etapa=3;render();}
let salvando=false;
async function confirmar(){if(salvando)return;dados.nome=document.getElementById('nome').value.trim();dados.telefone=document.getElementById('telefone').value.replace(/\D/g,'');if(dados.nome.length<3){aviso('Informe seu nome completo.');return;}if(!/^\d{10,11}$/.test(dados.telefone)){aviso('Informe um telefone válido com DDD.');return;}
if(!dados.hora||dados.data<hojeBR()){aviso('Escolha novamente um horário válido.');return;}
salvando=true;document.getElementById('confirmar').disabled=true;aviso('Salvando seu agendamento...');
const inicio=new Date(`${dados.data}T${dados.hora}:00-03:00`),fim=new Date(inicio.getTime()+dados.servico.minutos*60000);
try{
  const ocupacoes=await consultarOcupacoes(dados.data,dados.profissional.id);
  if(ocupacoes.some(a=>inicio<new Date(a.fim)&&fim>new Date(a.inicio))){
    throw new Error('Esse horário já está ocupado ou bloqueado. Volte e escolha outro horário.');
  }
  const {error}=await db.from('agendamentos').insert({cliente_nome:dados.nome,cliente_telefone:dados.telefone,profissional_id:dados.profissional.id,servico_id:dados.servico.id,inicio:inicio.toISOString(),fim:fim.toISOString(),status:'Confirmado'});if(error)throw error;etapa=4;render();}
catch(e){console.error(e);aviso('Não foi possível confirmar. '+(e.message||'Confira a agenda antes de tentar novamente.'));}
finally{salvando=false;const botao=document.getElementById('confirmar');if(botao)botao.disabled=false;}}
async function iniciar(){screen.innerHTML='<p class="hint">Carregando profissionais...</p>';const {data,error}=await db.from('profissionais').select('id,nome').eq('ativo',true).order('nome');if(error||!data?.length){console.error(error);screen.innerHTML='<h1>Não foi possível carregar os profissionais.</h1><p class="hint">Tente atualizar a página ou entre em contato com a barbearia.</p>';return;}profissionais=data;
const {data:servicosDB,error:erroServicos}=await db.from('servicos').select('id,nome,duracao_minutos,preco').eq('ativo',true).order('nome');
if(erroServicos||!servicosDB?.length){console.error('Erro ao carregar servicos:',erroServicos);screen.innerHTML='<h1>Não foi possível carregar os serviços.</h1><p class="hint">Confira a permissão de leitura da tabela servicos no Supabase e atualize a página.</p>';return;}
SERVICOS=servicosDB.filter(s=>Number(s.duracao_minutos)>0).map(s=>({id:s.id,nome:s.nome,minutos:Number(s.duracao_minutos),preco:s.preco}));
if(!SERVICOS.length){screen.innerHTML='<h1>Nenhum serviço disponível.</h1>';return;}
render();}
iniciar();
</script>
</body>
</html>
