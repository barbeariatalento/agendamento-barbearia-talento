
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbearia Talento - Agendamento</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    .container {
      max-width: 420px;
      margin: auto;
    }
    h1 { color: #e62929; }
    select, input, button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #d71920;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    label {
      display: block;
      text-align: left;
      margin-top: 12px;
    }
    #mensagem { margin-top: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>BARBEARIA TALENTO</h1>
    <h2>Agende seu horário</h2>

    <form id="agenda">
      <input id="nome" placeholder="Seu nome" required>
      <input id="telefone" placeholder="WhatsApp" required>

      <label>Escolha o profissional</label>
      <select id="profissional" required>
        <option value="">Selecione</option>
        
      </select>

      <label>Escolha o serviço</label>
      <select id="servico" required>
        <option value="">Selecione</option>
        <option value="40">Corte - 40 minutos</option>
        <option value="40">Barba - 40 minutos</option>
        <option value="60">Cabelo e barba - 60 minutos</option>
        <option value="30">Outros serviços - 30 minutos</option>
      </select>

      <label>Escolha a data</label>
      <input type="date" id="data" required>

      <label>Escolha o horário</label>
      <select id="horario" required>
        <option value="">Selecione o horário</option>
      </select>

      <button type="submit">Continuar agendamento</button>
    </form>
    <p id="mensagem"></p>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
   const SUPABASE_URL = "https://urfeqeoqkpgzuyulklnk.supabase.co";
const SUPABASE_KEY = "sb_publishable_BgFIN8TtCC2zIYWCBxV1EA_vpnXlXrD";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    async function carregarProfissionais() {
  const campo = document.getElementById("profissional");

  const { data, error } = await db
    .from("profissionais")
    .select("id, nome")
    .eq("ativo", true)
    .order("nome");

  if (error) {
    alert("Erro ao carregar profissionais: " + error.message);
    console.error(error);
    campo.options[0].textContent = "Erro ao carregar profissionais";
    return;
  }

  campo.innerHTML = '<option value="">Selecione</option>';
alert("Profissionais encontrados: " + data.length);
  data.forEach(p => {
    campo.add(new Option(p.nome, p.id));
  });
}

carregarProfissionais();
    alert("O código de profissionais foi iniciado!");
    const data = document.getElementById("data");
    const horario = document.getElementById("horario");
    const profissional = document.getElementById("profissional");
    const servico = document.getElementById("servico");

    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = String(hoje.getMonth()+1).padStart(2,"0");
    const dia = String(hoje.getDate()).padStart(2,"0");
    data.min = `${ano}-${mes}-${dia}`;

 async function atualizarHorarios() {
      horario.innerHTML =
        '<option value="">Selecione o horário</option>';

      if (!data.value || !profissional.value || !servico.value)
        return;
  const inicioDia = `${data.value}T00:00:00-03:00`;
const fimDia = `${data.value}T23:59:59-03:00`;

const { data: agendamentos, error } = await db
  .from("agendamentos")
  .select("inicio, fim, status")
  .eq("profissional_id", profissional.value)
  .gte("inicio", inicioDia)
  .lte("inicio", fimDia);

if (error) {
  console.error(error);
  horario.innerHTML =
    '<option value="">Erro ao consultar horários</option>';
  return;
}

      const diaSemana =
        new Date(data.value + "T12:00:00").getDay();

      if (diaSemana === 0 || diaSemana === 1) {
        horario.innerHTML =
          '<option value="">Fechado neste dia</option>';
        return;
      }

      const abertura = diaSemana === 6 ? 8 : 9;
      const fechamento = diaSemana === 6 ? 18 : 20;
      const duracao = Number(servico.value);

      for (let minutos = abertura * 60;
           minutos + duracao <= fechamento * 60;
           minutos += 10) {
        const h = String(Math.floor(minutos / 60))
          .padStart(2, "0");
        const m = String(minutos % 60).padStart(2, "0");
        const hora = `${h}:${m}`;
        const inicioSlot = new Date(
  `${data.value}T${hora}:00-03:00`
);

const fimSlot = new Date(
  inicioSlot.getTime() + duracao * 60000
);

const ocupado = (agendamentos || []).some(item => {
  if (item.status === "cancelado") return false;

  const inicioAgendado = new Date(item.inicio);
  const fimAgendado = new Date(item.fim);

  return (
    inicioSlot < fimAgendado &&
    fimSlot > inicioAgendado
  );
});

if (!ocupado) {
  horario.add(new Option(hora, hora));
}
      }
    }

    data.addEventListener("change", atualizarHorarios);
    profissional.addEventListener("change", atualizarHorarios);
    servico.addEventListener("change", atualizarHorarios);

  
document.getElementById("agenda")
  .addEventListener("submit", async function(event) {
    event.preventDefault();

    const mensagem = document.getElementById("mensagem");
    const nome = document.getElementById("nome").value.trim();
    const telefone = document.getElementById("telefone").value.trim();
    const profissionalId = profissional.value;
    const horaEscolhida = horario.value;
    const duracao = Number(servico.value);

    if (!nome || !telefone || !profissionalId ||
        !data.value || !horaEscolhida || !duracao) {
      mensagem.textContent = "Preencha todos os campos.";
      return;
    }

    const inicio = new Date(
      `${data.value}T${horaEscolhida}:00-03:00`
    );
    const fim = new Date(inicio.getTime() + duracao * 60000);

    mensagem.textContent = "Salvando agendamento...";

    const { error } = await db
      .from("agendamentos")
      .insert({
        cliente_nome: nome,
        cliente_telefone: telefone,
        profissional_id: profissionalId,
        servico_id: null,
        inicio: inicio.toISOString(),
        fim: fim.toISOString(),
        status: "Confirmado"
      });

    if (error) {
      console.error(error);
      alert("Erro: " + error.message);
      mensagem.textContent =
        "Não foi possível agendar. Verifique se o horário está livre.";
      return;
    }

    mensagem.textContent = "Agendamento confirmado com sucesso!";
    await atualizarHorarios();
  });

    // Correcao do sistema de agendamento
  </script>
</body>
</html>
